<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de Usuarios</title>

  <!-- Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>
<body>

  <section class="section">
    <div class="container">
      
      <div class="columns is-centered">
        <div class="column is-half">

          <div class="box">
            <h1 class="title has-text-centered">Formulario de Usuario</h1>

            <form>

              <!-- Nombre -->
              <div class="field">
                <label class="label">Nombre</label>
                <div class="control">
                  <input class="input" type="text" placeholder="Ingrese su nombre">
                </div>
              </div>

              <!-- Correo -->
              <div class="field">
                <label class="label">Correo Electrónico</label>
                <div class="control">
                  <input class="input" type="email" placeholder="ejemplo@gmail.com">
                </div>
              </div>

              <!-- Contraseña -->
              <div class="field">
                <label class="label">Contraseña</label>
                <div class="control">
                  <input class="input" type="password" placeholder="Ingrese su contraseña">
                </div>
              </div>

              <!-- Tipo de usuario -->
              <div class="field">
                <label class="label">Tipo de Usuario</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select>
                      <option>Administrador</option>
                      <option>Cliente</option>
                      <option>Empleado</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Checkbox -->
              <div class="field">
                <div class="control">
                  <label class="checkbox">
                    <input type="checkbox">
                    Acepto los términos y condiciones
                  </label>
                </div>
              </div>

              <!-- Botón -->
              <div class="field">
                <div class="control">
                  <button class="button is-primary is-fullwidth">
                    Registrar Usuario
                  </button>
                </div>
              </div>

            </form>
          </div>

        </div>
      </div>

    </div>
  </section>

</body>
</html>
